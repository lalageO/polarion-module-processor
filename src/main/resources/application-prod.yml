#   java -Dfile.encoding=UTF-8 -jar polarion-module-processor.jar --spring.config.location=./application-prod.yml

server:
  port: 8088

module-processor:
  output-dir: outputs
  default-module-name: unknown-module
  default-replace-mode: NONE
  default-mock-id-prefix: MOCK

  default-min-outline-depth: 2  # 2 表示默认忽略 "5. General" 这种一级章节标题。
  default-require-keyword: false # 不强制包含 shall/should/must 等关键词。
  default-include-sub-items: false # 保持 false，除非后续明确调整条款分组策略。
  level-two-min-text-length: 80 # 二级条款文本短于该长度时，倾向认为是章节标题并跳过。
  title-max-length: 80 # 规则生成标题的最大长度。
  csv-with-bom: true # true 表示 CSV 写入 UTF-8 BOM，方便 Windows Excel 打开不乱码。

polarion:
  base-url: "http://alm.freetech.com"
  module-file-name: "module.xml"

  default-project-id: "Demo"
  default-module-folder: "10 Stakeholder Requirement"
  default-work-item-type: "stakeholderrequirement"

  # 预留给 HTTP 下载认证方式。当前正式链路使用 SVN，保持 NONE。
  auth:
    type: "NONE"
    cookie: ""
    username: ""
    password: ""
    token: ""

  svn:
    executable: "svn"
    username: "polarion"
    password: "uaorar"

    checkout-timeout-seconds: 60
    update-timeout-seconds: 60
    commit-timeout-seconds: 60
    default-commit-message: "update module.xml"
    cleanup-temp-dir: true

    # 提交用工作副本位于 outputs/{jobId}/svn-workspace。
    cleanup-commit-workspace: false # false 表示保留该目录便于排查；稳定后可改为 true。

  work-item-api:
    enabled: true
    create-url: "http://10.179.60.154:30000/workitem/ws/create"

    default-polarion-id: "Demo"
    default-type: "stakeholderrequirement"
    default-author-id: ""

    connect-timeout-ms: 5000
    read-timeout-ms: 30000

    # 全局默认 customFields。保持空列表，避免所有项目都带上某个项目的特例字段。
    default-custom-fields: []

    # 按项目启用的 customFields 模板。key 必须和 moduleUrl 解析出的 projectId / createItem 的 polarionId 一致。
    # 这里存字段类型和枚举候选项，给后续 AI 选择使用；没有 value 的模板字段不会直接发给 createItem。
    # AI 或请求传入同 id 的 value 后，会复用这里的 type/enum-options 并发送最终字段。
    project-custom-fields:
      RMT_Platform:
        - id: "requirementsource"
          multi: false
          type: "EnumOptionId"
          enum-options:
            - id: "internal"
              name: "Internal内部的需求"
            - id: "external"
              name: "External来自外部的需求"
            - id: "Regulation"
              name: "Regulation法规需求"
        - id: "reqType"
          multi: false
          type: "EnumOptionId"
          enum-options:
            - id: "functional"
              name: "Functional Requirement 功能需求"
            - id: "nofunctional"
              name: "Non-Functional Requirement 非功能需求(性能等)"
            - id: "interface"
              name: "Interface Requirement 接口需求"
            - id: "constraint"
              name: "Constraint 约束条件"
            - id: "information"
              name: "Information 信息类需求"
        - id: "verificationcriteria"
          multi: false
          type: "text/html"
      RMT_Platfrom_Demo:
        - id: "requirementsource"
          multi: false
          type: "EnumOptionId"
          enum-options:
            - id: "internal"
              name: "Internal内部的需求"
            - id: "external"
              name: "External来自外部的需求"
            - id: "Regulation"
              name: "Regulation法规需求"
        - id: "reqType"
          multi: false
          type: "EnumOptionId"
          enum-options:
            - id: "functional"
              name: "Functional Requirement 功能需求"
            - id: "nofunctional"
              name: "Non-Functional Requirement 非功能需求(性能等)"
            - id: "interface"
              name: "Interface Requirement 接口需求"
            - id: "constraint"
              name: "Constraint 约束条件"
            - id: "information"
              name: "Information 信息类需求"
        - id: "verificationcriteria"
          multi: false
          type: "text/html"

    # 预留给 createItem 接口认证。当前接口不使用 token 认证。
    auth-type: "NONE"
    token: ""

ai:
  # 确认模型服务和提示词稳定后再改为 true。
  enabled: false
  provider: "openai-compatible"
  base-url: "http://llm.freetech.com/v1"
  chat-completions-path: "/chat/completions"
  # 公司内部默认模型名。后续切到阿里云兼容接口时可改这里和 base-url。
  model: "primary"
  api-key: ""

  # 模型接口超时、重试和调用间隔配置。
  connect-timeout-ms: 10000
  read-timeout-ms: 180000
  max-retries: 1
  retry-interval-ms: 1000
  request-interval-ms: 1000
  temperature: 0.2 # 生成文本的随机程度，0.2 表示较为保守，适合生成结构化内容。

  # 部分兼容网关不支持 response_format=json_object，默认不发送该参数。
  response-format-json: false

  # dryRun 是否也调用 AI。默认 false，避免预览时产生模型成本。
  run-in-dry-run: false

  # 普通项目只生成标题；特例项目生成标题和 requirementsource/reqType/verificationcriteria。
  title-prompt-path: "classpath:prompts/workitem-title-prompt.txt"
  field-prompt-path: "classpath:prompts/rmt-workitem-fields-prompt.txt"

  # 命中这些 projectId 时，走特例字段提示词；其他项目只生成标题。
  field-generation-projects:
    - "RMT_Platform"
    - "RMT_Platfrom_Demo"

  debug:
    # 开启后在 outputs/{jobId}/ai_debug.jsonl 逐条记录 prompt、原始响应和解析结果。
    enabled: true
    file-name: "ai_debug.jsonl"
    store-raw-response: true
    prompt-max-length: 4000
    raw-response-max-length: 4000
